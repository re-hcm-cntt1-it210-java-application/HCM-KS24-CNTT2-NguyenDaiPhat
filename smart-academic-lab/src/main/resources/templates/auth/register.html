<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><link rel="stylesheet" href="/css/app.css"><title>Đăng ký</title></head><body><div class="container">
<h2>Đăng ký</h2><div class="msg err" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/register}" th:object="${registerDto}" method="post">
<label>Tài khoản</label><input th:field="*{username}"><label>Mật khẩu</label><input type="password" th:field="*{password}"><label>Họ tên</label><input th:field="*{fullName}"><label>Email</label><input th:field="*{email}"><label>Điện thoại</label><input th:field="*{phone}">
<label>Vai trò</label><select th:field="*{role}"><option value="STUDENT">Sinh viên</option><option value="LECTURER">Giảng viên</option><option value="ADMIN">Admin</option></select><button>Đăng ký</button>
</form><a href="/login">Quay lại</a></div></body></html>
