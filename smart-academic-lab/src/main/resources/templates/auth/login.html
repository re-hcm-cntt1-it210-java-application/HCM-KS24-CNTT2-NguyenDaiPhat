<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><link rel="stylesheet" href="/css/app.css"><title>Đăng nhập</title></head><body><div class="container">
<h2>Đăng nhập</h2><div class="msg ok" th:if="${param.registered}">Đăng ký thành công, hãy đăng nhập.</div><div class="msg err" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/login}" th:object="${loginDto}" method="post"><label>Tài khoản</label><input th:field="*{username}"><label>Mật khẩu</label><input type="password" th:field="*{password}"><button>Đăng nhập</button></form>
<p>Tài khoản mẫu: student/123456, lecturer/123456, admin/123456</p><a href="/register">Đăng ký</a>
</div></body></html>
