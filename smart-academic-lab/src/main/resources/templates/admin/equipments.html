<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><link rel="stylesheet" href="/css/app.css"><title>Thiết bị</title></head><body><div class="container"><div th:replace="~{fragments/layout :: nav}"></div>
<h2>Quản lý danh mục thiết bị/tài liệu</h2><p><a class="btn" href="/admin/equipments/new">Thêm thiết bị</a></p><table><tr><th>Tên</th><th>Đơn vị</th><th>Tồn kho</th><th></th></tr><tr th:each="e:${equipments}"><td th:text="${e.name}"></td><td th:text="${e.unit}"></td><td th:text="${e.stockQuantity}"></td><td><a th:href="@{|/admin/equipments/${e.id}/edit|}">Sửa</a><form style="display:inline" th:action="@{|/admin/equipments/${e.id}/delete|}" method="post"><button class="danger">Xóa</button></form></td></tr></table>
</div></body></html>
