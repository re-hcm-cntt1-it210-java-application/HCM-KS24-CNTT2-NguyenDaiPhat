<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/app.css">
  <title>Hồ sơ học thuật</title>
</head>
<body>
<main class="container">
  <div th:replace="~{fragments/layout :: nav}"></div>

  <section class="page-header">
    <div>
      <h1>Hồ sơ học thuật liên kết</h1>
      <p class="muted">Lịch sử các lần tư vấn đã hoàn tất.</p>
    </div>
  </section>

  <div class="history-grid">
    <article th:each="h : ${histories}" class="card">
      <div class="card-title" th:text="${#temporals.format(h.startTime,'dd/MM/yyyy HH:mm')}"></div>
      <p><strong>Giảng viên:</strong> <span th:text="${h.lecturerName}"></span></p>
      <p><strong>Điểm:</strong> <span th:text="${h.score}"></span></p>
      <p><strong>Đánh giá:</strong> <span th:text="${h.competencyReview}"></span></p>
      <p><strong>Thiết bị/tài liệu:</strong> <span th:text="${#strings.listJoin(h.borrowedItems, ', ')}"></span></p>
    </article>
  </div>

  <div class="empty-state" th:if="${#lists.isEmpty(histories)}">Chưa có hồ sơ học thuật.</div>
</main>
</body>
</html>
