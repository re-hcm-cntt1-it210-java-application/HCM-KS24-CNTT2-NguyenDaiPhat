<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><link rel="stylesheet" href="/css/app.css"><title>Lịch của tôi</title></head><body><div class="container"><div th:replace="~{fragments/layout :: nav}"></div>
<h2>Lịch của tôi</h2><div class="msg ok" th:if="${param.success}">Đặt lịch thành công.</div><div class="msg ok" th:if="${param.cancelled}">Hủy lịch thành công.</div><div class="msg err" th:if="${param.error}" th:text="${param.error}"></div>
<table><tr><th>Giảng viên</th><th>Bắt đầu</th><th>Kết thúc</th><th>Trạng thái</th><th></th></tr><tr th:each="s:${sessions}"><td th:text="${s.lecturer.fullName}"></td><td th:text="${#temporals.format(s.startTime,'dd/MM/yyyy HH:mm')}"></td><td th:text="${#temporals.format(s.endTime,'HH:mm')}"></td><td th:text="${s.status}"></td><td><form th:if="${s.status.name()=='PENDING'}" th:action="@{|/student/sessions/${s.id}/cancel|}" method="post"><button class="danger">Hủy</button></form></td></tr></table>
</div></body></html>
